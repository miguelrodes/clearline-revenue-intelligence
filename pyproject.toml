[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "clearline-revenue-intelligence"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<4", "pydantic>=2.10,<3", "openai-agents>=0.6,<1",
  "streamlit>=1.40,<2", "python-dotenv>=1,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
clearline = "clearline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
